name: Apply zone shape test toggle

on:
  push:
    branches:
      - cleanup/ezone-structure
    paths:
      - scripts/add_zone_shape_toggle.py
      - .github/workflows/apply-zone-shape-toggle.yml

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'feat: add 180-degree zone test toggle')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
      - name: Apply 180-degree comparison mode
        run: python3 scripts/add_zone_shape_toggle.py
      - name: Verify narrow diff
        run: |
          git diff --check
          git diff -- index.html
      - name: Commit test toggle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add 180-degree zone test toggle"
          git push origin cleanup/ezone-structure
