name: Apply final E-Zone repairs

on:
  push:
    branches:
      - cleanup/ezone-structure
    paths:
      - '.github/workflows/apply-final-ezone-repairs.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
          fetch-depth: 0
      - name: Apply final repair patch
        run: python scripts/final_ezone_repairs.py
      - name: Validate patch diff
        run: git diff --check
      - name: Commit repaired candidate
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/campaign-sign-marker.svg tests/source-smoke.spec.js tests/smoke.spec.js; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/campaign-sign-marker.svg tests/source-smoke.spec.js tests/smoke.spec.js
          git commit -m "fix: harden campaign export and restore Help visuals"
          git push origin HEAD:cleanup/ezone-structure
