name: Final E-Zone cleanup patch

on:
  push:
    branches:
      - cleanup/ezone-structure
    paths:
      - .github/workflows/final-cleanup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: retry final cleanup patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/final_cleanup_patch.py
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: finish E-Zone UI and weak-signal cleanup"
          git push origin HEAD:cleanup/ezone-structure
