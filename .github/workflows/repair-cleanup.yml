name: Repair Cleanup Branch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'cleanup/ezone-structure'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Apply targeted repairs
        run: python3 scripts/repair-cleanup.py

      - name: Normalize repaired source
        run: npx prettier --write index.html feedback.html tests/source-smoke.spec.js

      - name: Run regular source smoke tests
        run: npx playwright test tests/source-smoke.spec.js

      - name: Commit repaired branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html feedback.html tests/source-smoke.spec.js
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "repair: resolve confirmed E-Zone smoke findings"
          git push origin HEAD:cleanup/ezone-structure
