name: Live Smoke Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Browser target to verify
        required: true
        default: both
        type: choice
        options:
          - local
          - deployed
          - both
      live_base_url:
        description: Optional deployed HTTPS URL override
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'feedback.html'
      - 'instructions.html'
      - 'assets/**'
      - 'package.json'
      - 'playwright.config.js'
      - 'tests/**'
      - '.github/workflows/live-smoke-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'feedback.html'
      - 'instructions.html'
      - 'assets/**'
      - 'package.json'
      - 'playwright.config.js'
      - 'tests/**'
      - '.github/workflows/live-smoke-test.yml'

permissions:
  contents: write

jobs:
  apply-help-footer-fix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
          fetch-depth: 0
      - name: Separate Help scroll content from close footer
        shell: bash
        run: |
          if grep -q 'class="instr-scroll"' index.html; then
            echo "Help footer already corrected."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          anchor = "      .instr-title {\n"
          css = """      .instr-scroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 2px 4px;
      }
      .instr-close-wrap {
        flex: 0 0 auto;
        text-align: center;
        padding: 10px 0 18px;
        background: #f3f4f6;
        position: relative;
        z-index: 4;
      }
      .instr-title {
"""
          if s.count(anchor) != 1: raise SystemExit('CSS anchor mismatch')
          s = s.replace(anchor, css, 1)
          card = '<div class="instr-card">'
          if s.count(card) != 1: raise SystemExit('card anchor mismatch')
          s = s.replace(card, card + '\n        <div class="instr-scroll">', 1)
          footer = '<div style="text-align:center;padding:12px 0 18px;position:sticky;bottom:-1px;z-index:5;background:linear-gradient(to bottom,rgba(243,244,246,0),#f3f4f6 32%);">'
          if s.count(footer) != 1: raise SystemExit('footer anchor mismatch')
          s = s.replace(footer, '</div>\n        <div class="instr-close-wrap">', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: separate Help content from close footer"
          git push origin HEAD:cleanup/ezone-structure

  local-playwright-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'local' || inputs.mode == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_SMOKE_MODE: local
      LOCAL_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Local Live Smoke Test
        run: npm run test:live-smoke
      - name: Upload successful verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-verification-local
          path: verification-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence-local
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  deployed-playwright-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deployed' || inputs.mode == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_SMOKE_MODE: deployed
      PREVIEW_BASE_URL: https://phshbone.github.io/billstestpage/ezone-cleanup/
      PRODUCTION_BASE_URL: https://phshbone.github.io/modzone/
      INPUT_LIVE_BASE_URL: ${{ inputs.live_base_url }}
      DEPLOY_IDENTITY_FILES: index.html,feedback.html,instructions.html,assets/campaign-sign-marker.svg
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Resolve deployed URL
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_LIVE_BASE_URL:-}" ]; then base="${INPUT_LIVE_BASE_URL}";
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then base="${PREVIEW_BASE_URL}";
          else base="${PRODUCTION_BASE_URL}"; fi
          case "$base" in https://*) ;; *) echo "Deployed Live Smoke requires an HTTPS URL: $base"; exit 2 ;; esac
          echo "LIVE_BASE_URL=${base%/}" >> "$GITHUB_ENV"
      - name: Wait for exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          base="${LIVE_BASE_URL%/}"
          IFS=',' read -ra files <<< "$DEPLOY_IDENTITY_FILES"
          deadline=$((SECONDS + 300))
          while true; do
            all_match=1
            for raw in "${files[@]}"; do
              file="$(echo "$raw" | xargs)"
              [ -n "$file" ] || continue
              tmp="$(mktemp)"
              rev="${GITHUB_SHA}-${RANDOM}"
              if ! curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "${base}/${file}?live-smoke-rev=${rev}" -o "$tmp"; then all_match=0;
              elif ! cmp -s "$file" "$tmp"; then all_match=0; fi
              rm -f "$tmp"
            done
            if [ "$all_match" -eq 1 ]; then echo "Exact deployed application files verified."; break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "Timed out waiting for deployed application."; exit 1; fi
            sleep 10
          done
      - name: Run Deployed Live Smoke Test
        run: npm run test:live-smoke
      - name: Upload successful verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-verification-deployed
          path: verification-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deployed
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence-deployed
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
