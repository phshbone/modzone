name: Apply queue persistence field-test repair

on:
  push:
    branches:
      - cleanup/ezone-structure
    paths:
      - scripts/fix_queue_persistence.py
      - .github/workflows/apply-queue-persistence-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'fix: persist cleared evidence queue')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
      - name: Apply queue persistence repair
        run: python3 scripts/fix_queue_persistence.py
      - name: Verify narrow diff
        run: |
          git diff --check
          git diff -- index.html
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: persist cleared evidence queue"
          git push origin cleanup/ezone-structure
