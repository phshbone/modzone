name: Final Cleanup Normalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'cleanup/ezone-structure'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Normalize remaining structural residue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          changes = {
            "appName: 'ModZone',": "appName: 'E-Zone',",
            "version: '0.9-final-visual-strike7',": "version: '0.9.1',",
            "        dragStartPt: null,\n        FEET_200: 60.96,": "        dragStartPx: null,",
            "metersToPixels(STATE.FEET_200)": "metersToPixels(CONFIG.defaultRadiusMeters)",
          }
          for old, new in changes.items():
              if old not in s:
                  raise SystemExit(f'Expected cleanup target not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Format and verify
        run: |
          npx prettier --write index.html
          npx playwright test tests/source-smoke.spec.js --reporter=list
      - name: Commit final normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: normalize final E-Zone state and version residue"
          git push origin HEAD:cleanup/ezone-structure
