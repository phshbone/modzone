name: Apply Campaign Incident Marker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'cleanup/ezone-structure'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Apply campaign marker
        run: python3 scripts/apply-campaign-marker.py

      - name: Format changed source
        run: npx prettier --write index.html tests/smoke.spec.js tests/source-smoke.spec.js

      - name: Run regular source smoke tests
        run: npx playwright test tests/source-smoke.spec.js --reporter=list

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full Live Smoke suite
        run: npm run test:live-smoke

      - name: Commit verified campaign marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/smoke.spec.js tests/source-smoke.spec.js assets/campaign-sign-marker.svg
          if git diff --cached --quiet; then
            echo 'Campaign marker already current'
            exit 0
          fi
          git commit -m 'refine: use campaign sign for incident marker'
          git push origin HEAD:cleanup/ezone-structure
