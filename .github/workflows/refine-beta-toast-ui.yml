name: Refine Beta Gate and Status Toast UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-beta-toast-ui.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Apply focused UI refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          old_css = """      #toast {
        position: fixed;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9000;
        background: rgba(22, 163, 74, 0.95);
        color: white;
        font-family: 'Oswald', sans-serif;
        font-size: 16px;
        padding: 10px 24px;
        border-radius: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
"""
          new_css = """      #toast {
        position: fixed;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9000;
        width: max-content;
        max-width: min(340px, calc(100vw - 48px));
        box-sizing: border-box;
        background: rgba(22, 163, 74, 0.95);
        color: white;
        font-family: 'Oswald', sans-serif;
        font-size: 15px;
        line-height: 1.25;
        text-align: center;
        padding: 9px 18px;
        border-radius: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
"""
          if old_css not in text:
              raise SystemExit('Expected toast CSS block not found')
          text = text.replace(old_css, new_css, 1)

          start = text.index('      <div\n        id="agreement-card"')
          end = text.index('\n    <div\n      id="welcome-overlay"', start)
          compact_gate = r'''      <div
        id="agreement-card"
        style="
          background: rgba(255, 255, 255, 0.97);
          border-radius: 24px;
          max-width: 390px;
          width: 100%;
          max-height: 88vh;
          overflow-y: auto;
          box-shadow: 0 10px 44px rgba(0, 0, 0, 0.55);
          border: 2px solid rgba(22, 163, 74, 0.7);
        "
      >
        <div style="background:#0a1628;padding:16px 18px 13px;text-align:center;">
          <div style="color:white;font-size:20px;font-weight:900;letter-spacing:.5px;">E-Zone Beta Check-In</div>
          <div style="color:#4ade80;font-size:12px;font-weight:900;letter-spacing:1.6px;margin-top:3px;">AUTHORIZED TESTER</div>
        </div>
        <div style="padding:18px 18px 16px;color:#1f2937;">
          <div style="font-size:14px;font-weight:800;line-height:1.45;margin-bottom:14px;text-align:center;">
            Enter your name and acknowledge the beta terms to continue. This screen cannot be skipped.
          </div>
          <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:12px 13px;margin-bottom:13px;font-size:12px;line-height:1.45;color:#334155;font-weight:700;">
            <div>• Keep the pre-release app confidential.</div>
            <div>• Use county/BOE guidance as the official electioneering authority.</div>
            <div>• Beta records may include your name, device/browser information, timestamps, and feedback.</div>
            <div>• Evidence photos are sent only when you choose the send-to-BOE action.</div>
          </div>
          <details style="margin-bottom:14px;border:1px solid #d1d5db;border-radius:12px;background:#f8fafc;overflow:hidden;">
            <summary style="padding:11px 13px;cursor:pointer;font-size:13px;font-weight:900;color:#0d1b4f;">View full beta terms</summary>
            <div style="padding:0 13px 12px;max-height:28vh;overflow-y:auto;font-size:11px;line-height:1.5;color:#334155;">
              <p><strong>1. CONFIDENTIALITY</strong><br />This app is pre-release. Do not share the link, screenshots, or descriptions of its functionality with anyone outside this authorized testing group without written permission from the creator.</p>
              <p><strong>2. OWNERSHIP</strong><br />E-Zone, including all concepts, designs, workflows, and data, is the original creative work of William McKenna. Nothing in this agreement transfers any ownership or rights to you.</p>
              <p><strong>3. FEEDBACK</strong><br />Any feedback you provide may be used to improve the app. You will not receive compensation, but your contribution is appreciated.</p>
              <p><strong>4. NO WARRANTIES</strong><br />This is beta software provided as-is. The creator is not responsible for errors in zone measurements or legal interpretations. Always consult your county Board of Elections for official electioneering guidelines.</p>
              <p><strong>5. DATA &amp; PRIVACY</strong><br />This beta submits agreement/check-in records and tester feedback through the connected E-Zone submission system. Those records can include your name, device/browser information, timestamps, and testing responses. GPS is used for the electioneering boundary workflow. Evidence photos are queued on the device and are transmitted only when you choose the app's send-to-BOE action.</p>
              <p><strong>6. TERM</strong><br />This agreement applies for the duration of the beta testing period and survives its conclusion with respect to confidentiality.</p>
              <p style="color:#64748b;">E-Zone is an independent civic technology project. Not affiliated with any government agency, political party, or Board of Elections. &copy; 2026 E-Zone. All Rights Reserved.</p>
            </div>
          </details>
          <input
            id="agree-name"
            type="text"
            placeholder="Your full name"
            autocomplete="name"
            oninput="this.style.borderColor='#d1d5db'"
            style="width:100%;box-sizing:border-box;padding:13px 14px;border:2px solid #d1d5db;border-radius:12px;font-size:16px;font-weight:800;margin-bottom:12px;outline:none;"
          />
          <label id="agree-label" style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;cursor:pointer;">
            <input id="agree-check" type="checkbox" onchange="onAgreeCheck()" style="width:22px;height:22px;accent-color:#16a34a;flex:0 0 auto;" />
            <span style="font-size:13px;font-weight:800;color:#1a1a2e;line-height:1.35;">I have read the beta summary and agree to the E-Zone beta testing terms.</span>
          </label>
          <button
            id="agree-btn"
            disabled
            onclick="submitAgreement()"
            style="width:100%;padding:15px;background:#16a34a;color:white;border:none;border-radius:14px;font-size:17px;font-weight:900;cursor:pointer;opacity:.4;box-shadow:0 4px 8px rgba(0,0,0,.25);"
          >
            Enter Beta
          </button>
          <div id="agree-status" style="min-height:18px;margin-top:9px;text-align:center;color:#6b7280;font-size:12px;font-weight:800;"></div>
        </div>
      </div>
    </div>
'''
          text = text[:start] + compact_gate + text[end:]

          text, n = re.subn(
              r"\n      function onAgreementScroll\(el\) \{.*?\n      \}\n      function onAgreeCheck\(\)",
              "\n      function onAgreeCheck()",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Expected scroll-gate function not found')

          text = text.replace(
              "'Please scroll, read, and check the agreement box.',",
              "'Please check the beta agreement box.',",
              1,
          )

          old_toast_fn = """      function showToast(msg, color) {
        color = color || '#16a34a';
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.background = color;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
      }
"""
          new_toast_fn = """      function positionToast() {
        const t = document.getElementById('toast');
        const bar = document.getElementById('bottom-bar');
        if (!t || !bar || !bar.children.length) {
          if (t) {
            t.style.top = 'auto';
            t.style.bottom = '120px';
          }
          return;
        }
        const barRect = bar.getBoundingClientRect();
        const toastHeight = Math.max(t.offsetHeight || 0, 42);
        const top = Math.max(150, barRect.top - toastHeight - 16);
        t.style.bottom = 'auto';
        t.style.top = top + 'px';
      }

      function showToast(msg, color) {
        color = color || '#16a34a';
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.background = color;
        t.classList.add('show');
        requestAnimationFrame(() => {
          positionToast();
          requestAnimationFrame(positionToast);
        });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
      }
"""
          if old_toast_fn not in text:
              raise SystemExit('Expected showToast function not found')
          text = text.replace(old_toast_fn, new_toast_fn, 1)

          path.write_text(text)

          test_path = Path('tests/smoke.spec.js')
          tests = test_path.read_text()
          marker = "  test('compact mandatory beta gate avoids forced scrolling'"
          if marker not in tests:
              insert = r'''
  test('compact mandatory beta gate avoids forced scrolling', async ({ page }) => {
    await page.goto('/index.html', { waitUntil: 'domcontentloaded' });
    await page.waitForTimeout(900);

    await expect(page.locator('#agreement-overlay')).toBeVisible();
    await expect(page.locator('#agreement-card')).toBeVisible();
    await expect(page.locator('#agree-scroll')).toHaveCount(0);
    await expect(page.locator('#agree-check')).toBeEnabled();
    await expect(page.locator('#agreement-card details summary')).toContainText('View full beta terms');
    await expect(page.locator('#agreement-card')).not.toContainText('Please scroll through');
  });

  test('status toast stays above the bottom action area', async ({ page }) => {
    await page.goto('/index.html', { waitUntil: 'domcontentloaded' });
    await page.evaluate(() => {
      hideStartupOverlays();
      document.getElementById('map-ui').style.display = 'block';
      renderScreen('s8');
      showToast('GPS location saved', '#16a34a');
    });
    await page.waitForTimeout(100);

    const positions = await page.evaluate(() => {
      const toast = document.getElementById('toast').getBoundingClientRect();
      const bar = document.getElementById('bottom-bar').getBoundingClientRect();
      return { toastBottom: toast.bottom, barTop: bar.top };
    });

    expect(positions.toastBottom).toBeLessThan(positions.barTop);
  });
'''
              idx = tests.rfind('\n});')
              if idx == -1:
                  raise SystemExit('Could not find test describe closing marker')
              tests = tests[:idx] + insert + tests[idx:]
              test_path.write_text(tests)
          PY

      - name: Format changed source
        run: npx prettier --write index.html tests/smoke.spec.js

      - name: Run source smoke tests
        run: npx playwright test tests/source-smoke.spec.js --reporter=list

      - name: Run full Live Smoke suite
        run: npx playwright install --with-deps chromium && npm run test:live-smoke

      - name: Commit verified UI refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/smoke.spec.js
          if git diff --cached --quiet; then
            echo 'UI refinement already current'
            exit 0
          fi
          git commit -m 'refine: compact beta gate and reposition status toasts'
          git push origin HEAD:cleanup/ezone-structure
