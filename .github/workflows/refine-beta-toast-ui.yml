name: Refine Beta Gate and Status Toast UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-beta-toast-ui.yml'
      - 'scripts/refine-beta-toast-ui.py'
      - 'scripts/fix-generated-ui-smoke.py'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/ezone-structure
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Apply focused UI refinements
        run: python3 scripts/refine-beta-toast-ui.py

      - name: Fix generated UI smoke setup
        run: python3 scripts/fix-generated-ui-smoke.py

      - name: Format changed source
        run: npx prettier --write index.html tests/smoke.spec.js

      - name: Run regular source smoke tests
        run: npx playwright test tests/source-smoke.spec.js --reporter=list

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full Live Smoke suite
        run: npm run test:live-smoke

      - name: Commit verified UI refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/smoke.spec.js
          if git diff --cached --quiet; then
            echo 'UI refinement already current'
            exit 0
          fi
          git commit -m 'refine: compact beta gate and reposition status toasts'
          git push origin HEAD:cleanup/ezone-structure
