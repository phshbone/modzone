name: Structure Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'cleanup/ezone-structure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit structural residue
        run: |
          python3 - <<'PY' | tee structure-audit.txt
          from pathlib import Path
          import re, collections

          files = ['index.html', 'feedback.html', 'instructions.html']
          hard_fail = False
          print('# E-Zone structural audit')
          for fn in files:
              text = Path(fn).read_text()
              ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
              dup_ids = [k for k,v in collections.Counter(ids).items() if v > 1]
              funcs = re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', text)
              dup_funcs = [k for k,v in collections.Counter(funcs).items() if v > 1]
              print(f'\n## {fn}')
              print(f'IDs: {len(ids)}; duplicate IDs: {dup_ids or "none"}')
              print(f'Named functions: {len(funcs)}; duplicate named functions: {dup_funcs or "none"}')
              if dup_ids or dup_funcs:
                  hard_fail = True
              if fn == 'index.html':
                  candidates = []
                  for name in funcs:
                      count = len(re.findall(r'\b' + re.escape(name) + r'\b', text))
                      if count == 1:
                          candidates.append(name)
                  print('Declaration-only function candidates:', ', '.join(candidates) if candidates else 'none')
                  markers = sorted(set(re.findall(r'(?i)\b(?:patch|strike\d*|temporary|builder bypass|legacy)\b', text)))
                  print('Legacy/patch marker words:', ', '.join(markers) if markers else 'none')
                  for key in ['dragStartPt', 'dragStartPx', 'FEET_200']:
                      print(f'{key} occurrences: {text.count(key)}')
          if hard_fail:
              raise SystemExit('Duplicate structural declarations found.')
          PY
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-audit
          path: structure-audit.txt
          retention-days: 7
